name: Revis
options:
  bundleIdPrefix: app.revis
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.5"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 42SSLNY3WS
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true
    ENABLE_USER_SCRIPT_SANDBOXING: false
  debug:
    CODE_SIGN_IDENTITY: "Sign to Run Locally"
    CODE_SIGN_STYLE: Manual
    PROVISIONING_PROFILE_SPECIFIER: ""
packages:
  # Apex is consumed as `ApexC`, the C library, and NOT as the `Apex` Swift wrapper.
  #
  # Two reasons, and the first is not a preference. The `Apex` product's targets carry
  # `.unsafeFlags`, and SwiftPM refuses a package that does when it is depended on by
  # version — resolution fails outright with "contains unsafe build flags". `ApexC` carries
  # none, so it resolves normally.
  #
  # The second is that the Swift wrapper's `ApexOptions` exposes twelve flags and the C
  # `apex_options` struct has about ninety. Every switch this app puts in front of a
  # reviewer — tables, footnotes, smart typography, wiki links, definition lists — exists
  # only in C. See `MarkdownRenderer`, which is the one place that boundary is crossed.
  Apex:
    url: https://github.com/ApexMarkdown/apex
    from: 1.1.21
targets:
  Revis:
    type: application
    platform: macOS
    sources:
      - Revis
    dependencies:
      - package: Apex
        product: ApexC
      # Build-order only: the helper is a tool, so it must not be linked or
      # embedded — the post-build script copies it into Contents/Helpers.
      - target: RevisUpdater
        embed: false
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.revis.app
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: '"Revis/Preview Content"'
        ENABLE_PREVIEWS: true
      configs:
        debug:
          # Un-sandboxed for local debug: ad-hoc signing plus the App Sandbox
          # crashes WebKit's WebContent child, and this app is a web view.
          CODE_SIGN_ENTITLEMENTS: Revis/Revis.Debug.entitlements
          UPDATER_ENTITLEMENTS: Updater/revis-updater.Debug.entitlements
        release:
          # Release is un-sandboxed too, since 0.3.0. The in-app updater cannot
          # replace the app in /Applications from inside a container; the file
          # itself records the whole reasoning.
          CODE_SIGN_ENTITLEMENTS: Revis/Revis.DeveloperID.entitlements
          UPDATER_ENTITLEMENTS: Updater/revis-updater.DeveloperID.entitlements
    info:
      path: Revis/Info.plist
      properties:
        CFBundleName: Revis
        CFBundleDisplayName: Revis
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: "public.app-category.productivity"
        NSHumanReadableCopyright: "Copyright © 2026 Robert Salesas. Source-available under PolyForm Noncommercial 1.0.0."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Revis Review
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.revis.review
          # Read-only: opening one starts a review, and the review is what gets
          # saved. Alternate rank so Revis never displaces the user's browser as
          # the handler for every .html on the disk.
          - CFBundleTypeName: HTML Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.html
          # Same treatment as HTML, and the same rank: opening a .md starts a review of it
          # and the review is what gets saved. Revis is not anybody's Markdown editor.
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        # Imported, not exported: the identifier is Daring Fireball's and is already
        # declared by half the editors on the disk. Declaring it as ours would be a claim
        # to own it, and Launch Services resolves the conflict by picking one at random.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkd
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.revis.review
            UTTypeDescription: Revis Review
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - revis
    scheme:
      testTargets:
        - name: RevisTests
          parallelizable: true
      gatherCoverageData: true
      coverageTargets:
        - Revis
    postBuildScripts:
      - name: Bundle the updater helper
        # It ships at Contents/Helpers, which is where `AppUpdater.helperURL`
        # looks — spelled out there rather than found through
        # `url(forAuxiliaryExecutable:)`, which only searches Contents/MacOS.
        #
        # Signed with --timestamp=none so a Debug build never waits on Apple's
        # timestamp server. That is not acceptable to the notary service, so
        # scripts/release.sh re-signs this binary with a real timestamp after the
        # Developer ID export and re-seals the app around it.
        script: |
          HELPERS="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "$HELPERS"
          cp -f "${BUILT_PRODUCTS_DIR}/revis-updater" "$HELPERS/revis-updater"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
              --options runtime --timestamp=none \
              --entitlements "${SRCROOT}/${UPDATER_ENTITLEMENTS}" \
              "$HELPERS/revis-updater"
          fi
        basedOnDependencyAnalysis: false
      - name: Stamp Version
        script: |
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ -f "${SRCROOT}/VERSION" ]; then
            VERSION=$(cat "${SRCROOT}/VERSION" | tr -d '[:space:]')
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "${PLIST}" 2>/dev/null || true
          fi
          BUILD=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null || echo "1")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD}" "${PLIST}" 2>/dev/null || true
        basedOnDependencyAnalysis: false
  # The half of the updater that cannot live in the app: a bundle cannot replace
  # itself while its own code is mapped. Nothing else is in here, and nothing here
  # decides anything — every check that gates an install has already run in
  # `AppUpdater` by the time this binary starts.
  RevisUpdater:
    type: tool
    platform: macOS
    sources:
      - Updater
    settings:
      base:
        PRODUCT_NAME: revis-updater
        # The binary is `revis-updater`, but the Swift module must not be named
        # anything that collides with the app's: both land in the same Products
        # directory, and on case-insensitive APFS a near-miss breaks
        # `@testable import Revis` in the test target with "no such module".
        PRODUCT_MODULE_NAME: RevisUpdater
        PRODUCT_BUNDLE_IDENTIFIER: app.revis.updater
        # Must NOT be installed into the archive. A tool target otherwise lands in
        # Products/usr/local/bin, the archive then holds two installed products,
        # Xcode can no longer tell which is the app, and it writes no
        # ApplicationProperties — at which point EVERY distribution method is
        # rejected ("Unknown Distribution Error") and the release breaks. The app's
        # post-build script copies the binary out of BUILT_PRODUCTS_DIR, which does
        # not need it installed.
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: true
        # Signed by the app's post-build script, which is the only place that knows
        # which entitlements this configuration wants. Signing it here as well would
        # be a second opinion about the same binary.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: false

  RevisTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
    dependencies:
      - target: Revis
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.revis.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Revis.app/Contents/MacOS/Revis"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_TESTING_SEARCH_PATHS: true
